<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">

  <title>فهد | مساعدك الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #0b1220, #17233b);
      color: white;
      padding: 22px 20px 25px;
      border-radius: 0 0 28px 28px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
    }

    .brand p {
      margin: 4px 0 0;
      color: #b8c2d6;
      font-size: 13px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .main {
      flex: 1;
      padding: 22px 18px 105px;
    }

    .welcome {
      background: #f7faf9;
      border: 1px solid #e5eee8;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .welcome p {
      margin: 0;
      color: #64748b;
      line-height: 1.7;
      font-size: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 22px 4px 12px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .quick {
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 18px;
      padding: 18px 15px;
      text-align: right;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(15, 23, 42, .04);
    }

    .quick:active {
      transform: scale(.97);
    }

    .quick-icon {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .quick strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .quick span {
      color: #7b8798;
      font-size: 12px;
    }

    .chat-card {
      margin-top: 20px;
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #dcfce7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .chat-title strong {
      font-size: 14px;
    }

    .chat-title small {
      display: block;
      color: #22a45a;
      margin-top: 3px;
    }

    .message {
      background: #f1f5f9;
      border-radius: 16px 16px 5px 16px;
      padding: 13px;
      font-size: 14px;
      line-height: 1.7;
      min-height: 50px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      margin-top: 14px;
      direction: rtl;
    }

    .input-area input {
      flex: 1;
      border: 1px solid #dce2e9;
      border-radius: 15px;
      padding: 13px;
      outline: none;
      font-size: 14px;
      min-width: 0;
      direction: rtl;
    }

    .input-area input:focus {
      border-color: #22c55e;
    }

    .send {
      width: 48px;
      height: 48px;
      flex: 0 0 48px;
      border: 0;
      border-radius: 15px;
      background: #16a34a;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .send:active {
      transform: scale(.95);
    }

    .send:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 100%);
      height: 78px;
      background: rgba(255, 255, 255, .96);
      backdrop-filter: blur(12px);
      border-top: 1px solid #e8edf2;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    .nav-item {
      border: 0;
      background: none;
      color: #8993a3;
      font-size: 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .nav-item span {
      font-size: 22px;
    }

    .nav-item.active {
      color: #16a34a;
      font-weight: bold;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .45);
      z-index: 20;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-box {
      width: min(520px, 100%);
      background: white;
      border-radius: 28px 28px 0 0;
      padding: 25px 20px 30px;
    }

    .modal-box h3 {
      margin-top: 0;
    }

    .close {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 14px;
      background: #0b1220;
      color: white;
      font-size: 15px;
      margin-top: 15px;
    }

    @media (min-width: 600px) {
      body {
        padding: 20px 0;
      }

      .app {
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 15px 50px rgba(15, 23, 42, .12);
      }

      .nav {
        bottom: 20px;
        border-radius: 20px;
        border: 1px solid #e8edf2;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="header-top">

        <div class="brand">
          <div class="logo">ف</div>

          <div>
            <h1>فهد</h1>
            <p>مساعدك الذكي</p>
          </div>
        </div>

        <div class="status">
          <span class="dot"></span>
          متصل
        </div>

      </div>
    </header>

    <main class="main">

      <section class="welcome">
        <h2>أهلًا بك 👋</h2>

        <p>
          أنا فهد، مساعدك الذكي.
          اكتب لي ما تريد وسأساعدك خطوة بخطوة.
        </p>
      </section>

      <div class="section-title">
        ماذا تريد من فهد؟
      </div>

      <section class="quick-grid">

        <button class="quick" onclick="quickAction('اسأل فهد')">
          <div class="quick-icon">💬</div>
          <strong>اسأل فهد</strong>
          <span>احصل على إجابة سريعة</span>
        </button>

        <button class="quick" onclick="quickAction('خطط لي')">
          <div class="quick-icon">📋</div>
          <strong>خطط لي</strong>
          <span>أنشئ خطة تناسبك</span>
        </button>

        <button class="quick" onclick="quickAction('ابحث لي')">
          <div class="quick-icon">🔎</div>
          <strong>ابحث لي</strong>
          <span>ساعدني في الوصول للمعلومة</span>
        </button>

        <button class="quick" onclick="quickAction('ساعدني')">
          <div class="quick-icon">⚡</div>
          <strong>ساعدني</strong>
          <span>ابدأ مهمة جديدة</span>
        </button>

      </section>

      <section class="chat-card">

        <div class="chat-title">

          <div class="mini-logo">ف</div>

          <div>
            <strong>تحدث مع فهد</strong>
            <small>جاهز لمساعدتك</small>
          </div>

        </div>

        <div class="message" id="message">
          مرحبًا! 👋 كيف يمكنني مساعدتك اليوم؟
        </div>

        <div class="input-area">

          <input
            id="userInput"
            type="text"
            placeholder="اكتب رسالتك لفهد..."
            autocomplete="off"
          >

          <button
            id="sendButton"
            class="send"
            type="button"
            onclick="sendMessage()"
            aria-label="إرسال"
          >➤</button>

        </div>

      </section>

    </main>

    <nav class="nav">

      <button class="nav-item active" onclick="home()">
        <span>⌂</span>
        الرئيسية
      </button>

      <button class="nav-item" onclick="showInfo('المحادثات')">
        <span>💬</span>
        المحادثات
      </button>

      <button class="nav-item" onclick="showInfo('المهام')">
        <span>✓</span>
        المهام
      </button>

      <button class="nav-item" onclick="showInfo('الإعدادات')">
        <span>⚙</span>
        الإعدادات
      </button>

    </nav>

  </div>

  <div class="modal" id="modal">

    <div class="modal-box">

      <h3 id="modalTitle">فهد</h3>

      <p id="modalText">
        هذه الوظيفة سيتم تفعيلها في المرحلة القادمة.
      </p>

      <button class="close" onclick="closeModal()">
        حسنًا
      </button>

    </div>

  </div>

  <script>

    async function sendMessage() {

      const input = document.getElementById("userInput");
      const message = document.getElementById("message");
      const sendButton = document.getElementById("sendButton");

      const text = input.value.trim();

      if (!text) {
        return;
      }

      input.disabled = true;
      sendButton.disabled = true;

      message.innerHTML = "⏳ فهد يفكر...";

      try {

        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "حدث خطأ");
        }

        message.innerHTML =
          "<strong>فهد:</strong><br><br>" +
          escapeHtml(data.reply);

      } catch (error) {

        console.error("Chat Error:", error);

        message.innerHTML =
          "❌ حدث خطأ أثناء الاتصال بالذكاء الاصطناعي.<br><br>" +
          "حاول مرة أخرى.";

      } finally {

        input.disabled = false;
        sendButton.disabled = false;
        input.value = "";
        input.focus();

      }

    }

    function handleEnter(event) {

      if (event.key === "Enter") {
        event.preventDefault();
        sendMessage();
      }

    }

    document
      .getElementById("userInput")
      .addEventListener("keydown", handleEnter);

    function quickAction(title) {

      const input = document.getElementById("userInput");

      input.value = title;
      input.focus();

    }

    function showInfo(title) {

      document.getElementById("modalTitle").innerText = title;

      document.getElementById("modalText").innerText =
        "قسم " + title +
        " سيكون متاحًا في التطوير القادم من فهد.";

      document.getElementById("modal").style.display = "flex";

    }

    function closeModal() {

      document.getElementById("modal").style.display = "none";

    }

    function home() {

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

    function escapeHtml(text) {

      const div = document.createElement("div");

      div.textContent = text;

      return div.innerHTML;

    }

  </script>

</body>
</html>
