
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فهد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #111827;
    }

    .welcome {
      text-align: center;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 15px;
      margin-top: 10px;
      font-size: 17px;
      cursor: pointer;
      background: #111827;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>فهد</h1>
    <p>مرحبًا بك في النسخة الأولى</p>
  </header>

  <div class="container">

    <div class="card welcome">
      <h2>أهلًا بك 👋</h2>
      <p>
        تم تشغيل صفحة فهد بنجاح على الإنترنت.
      </p>

      <button onclick="showMessage()">
        ابدأ مع فهد
      </button>
    </div>

    <div class="card">
      <h2>عن فهد</h2>
      <p>
        هذه هي النسخة الأولى من مشروع فهد، وسيتم تطويرها وإضافة الوظائف
        المطلوبة إليها تدريجيًا.
      </p>
    </div>

  </div>

  <footer>
    © 2026 فهد
  </footer>

  <script>
    function showMessage() {
      alert("مرحبًا! فهد يعمل الآن بنجاح 🎉");
    }
  </script>

</body>
</html>
