<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1220">

  <title>فهد | مساعدك الذكي</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      background: #fff;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #0b1220, #17233b);
      color: white;
      padding: 22px 20px 25px;
      border-radius: 0 0 28px 28px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo,
    .mini-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .logo {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      font-size: 25px;
    }

    .brand h1 {
      margin: 0;
      font-size: 24px;
    }

    .brand p {
      margin: 4px 0 0;
      color: #b8c2d6;
      font-size: 13px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cbd5e1;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
    }

    .main {
      flex: 1;
      padding: 22px 18px 105px;
    }

    .welcome {
      background: #f7faf9;
      border: 1px solid #e5eee8;
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .welcome h2 {
      margin: 0 0 8px;
      font-size: 21px;
    }

    .welcome p {
      margin: 0;
      color: #64748b;
      line-height: 1.7;
      font-size: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: bold;
      margin: 22px 4px 12px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .quick {
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 18px;
      padding: 18px 15px;
      text-align: right;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(15, 23, 42, .04);
      font-family: inherit;
    }

    .quick:active {
      transform: scale(.97);
    }

    .quick-icon {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .quick strong {
      display: block;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .quick span {
      color: #7b8798;
      font-size: 12px;
    }

    .chat-card {
      margin-top: 20px;
      background: white;
      border: 1px solid #e7ebf0;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 5px 18px rgba(15, 23, 42, .05);
    }

    .chat-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .mini-logo {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #dcfce7;
      font-size: 20px;
    }
